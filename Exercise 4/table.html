<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CADT Shop</title>
    <style>
      table {
      width: 80%;
      margin: 0 auto;
      border-collapse: collapse;
      }
      th, td {
        border: 1px solid black;
        padding: 8px;
        text-align: left;
      }
      th {
          background-color: lightgray;
      }
    </style>
  </head>

  <body>
    <h1 style="text-align : center;">Welcome to CADT Shop!</h1>
    <h2 style="text-align : center;">Product Catalog</h2>
    <table>
      <tr>
        <th>Product Name</th>
        <th>Price</th>
        <th>Quantity</th>
        <th>In Stock</th>
      </tr>

      <tr>
        <td>C# Book</td>
        <td>$10</td>
        <td>5</td>
        <td>YES</td>
      </tr>

      <tr>
        <td>CADT Polo</td>
        <td>$12</td>
        <td>60</td>
        <td>YES</td>
      </tr>

      <tr>
        <td>CADT Mouse</td>
        <td>$100</td>
        <td>3</td>
        <td>NO</td>
      </tr>
    </table>
  </body>
</html>
